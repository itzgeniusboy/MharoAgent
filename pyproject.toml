[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mharoagent"
version = "0.3.0"
description = "Multi-provider async AI agent framework (SSE streaming, router, engine)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]