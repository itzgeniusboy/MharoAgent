# Mharo Agent — pyproject
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mharo"
version = "0.1.0"
description = "Mharo Agent — fully-autonomous all-in-one coding agent (Termux + PC)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "typing-extensions>=4.9",
]

[project.scripts]
ma = "mharo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mharo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
